<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="轻净 LightClean 图形标（品牌青绿版）">
  <title>轻净 LightClean 图形标（品牌青绿版）</title>
  <desc>商标形状完全保留，仅将双眼替换为品牌青绿色，用于需要与产品界面统一色调的场合。</desc>
  <defs>
    <linearGradient id="lcInk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222B38"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="lcEyeTeal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#lcInk2)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 190 L300 320 L500 400 L700 320 L820 190"/>
    <path d="M132 208 C95 300 70 430 82 545 C98 690 200 815 370 878 L500 915 L630 878 C800 815 902 690 918 545 C930 430 905 300 868 208"/>
  </g>

  <circle cx="130" cy="140" r="72" fill="url(#lcInk2)"/>
  <circle cx="870" cy="140" r="72" fill="url(#lcInk2)"/>

  <path d="M190 520 Q358 520 415 675 Q247 675 190 520 Z" fill="url(#lcEyeTeal)"/>
  <path d="M810 520 Q642 520 585 675 Q753 675 810 520 Z" fill="url(#lcEyeTeal)"/>
</svg>
