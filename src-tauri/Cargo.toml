[package]
name = "old666"
version = "0.1.3"
description = "老六清净 old666 — 无广告纯绿色的 Windows 系统优化工具"
authors = ["reloadbug"]
edition = "2021"
rust-version = "1.77"
default-run = "old666"

[lib]
name = "old666_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "old666"
path = "src/main.rs"

# P0 性能基线 CLI（无需 GUI，用于测量枚举/采集耗时）
[[bin]]
name = "old666-poc"
path = "src/bin/poc.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# ── 兼容性垫片（不要删）────────────────────────────────────────────
# 背景：tauri-build → tauri-utils → schemars 0.8 → indexmap 1.9。
# indexmap 1.9.3 的 build.rs 在未显式请求 `std` feature 时会用 autocfg
# 探测 sysroot 是否有 std；在本机（rustc 1.99 + 该沙箱环境）探测失败，
# 于是 indexmap 走 `#[cfg(not(has_std))]` 分支，`IndexMap<K,V,S>` 失去
# `S = RandomState` 默认值，导致 schemars 编译报 E0107。
#
# indexmap 的 build.rs 明确留了正门：
#     match env::var_os("CARGO_FEATURE_STD") {
#         Some(_) => autocfg::emit("has_std"),      // 显式请求就不探测
#         None    => autocfg::new().emit_sysroot_crate("std"),
#     }
# 因此这里显式开启 `std`。build 图与 normal 图的 feature 解析相互独立
# （resolver v2），两边都要写。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "1.9", features = ["std"] }   # 见上方 build-dependencies 注释
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "z"      # 体积优先
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 1

# ── 本地测试专用 profile（不影响正式发布）──────────────────────────
# release 为了 2.9 MB 的体积开了 lto + codegen-units=1 + opt-level=z，
# 代价是**前端改一行也要重编整个 crate**（实测 1m48s），迭代体验很差。
# 这里关掉 LTO、放开并行 codegen，只留 opt-level=1 让启动速度接近正式包。
# 产物在 target/dev-fast/old666.exe，与 target/release/ 互不影响。
[profile.dev-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = true

